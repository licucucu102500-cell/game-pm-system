<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GamePM · 游戏项目管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="logo">G</div><div><b>GamePM</b><small>游戏项目管理系统</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">作品集 Demo · 数据仅保存在本地浏览器</div>
  </aside>
  <main>
    <header class="topbar">
      <div><h1 id="page-title"></h1><div id="proj-meta" class="muted sm"></div></div>
      <div class="top-actions">
        <div id="countdown" class="countdown"></div>
        <button class="btn" onclick="openWeekly()">📝 一键周报</button>
        <button class="btn ghost" onclick="exportData()">导出数据</button>
        <button class="btn ghost" onclick="resetData()">重置演示数据</button>
      </div>
    </header>
    <section id="view"></section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modal-title"></h3><button class="x" onclick="closeModal()">×</button></div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">关闭</button><button class="btn" id="modal-save">保存</button></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
